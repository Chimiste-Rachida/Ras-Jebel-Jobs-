<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ras Jebel Jobs</title>
<style>
body{font-family:Arial;margin:0;background:#f5f7fa;color:#222}
header{background:#0f172a;color:white;text-align:center;padding:25px}
.container{max-width:900px;margin:25px auto;padding:15px}
.card{background:white;padding:20px;margin:15px 0;border-radius:15px;box-shadow:0 4px 15px #0001}
button{background:#0f172a;color:white;border:0;padding:12px 20px;border-radius:8px;cursor:pointer}
footer{text-align:center;padding:25px;color:#666}
</style>
</head>

<body>

<header>
<h1>👤 فضاء الباحث عن عمل</h1>
<p>Ras Jebel Jobs</p>
</header>

<div class="container">
<div class="card">
<h2>💼 عروض الشغل المتاحة</h2>
<div id="jobs">جاري تحميل العروض...</div>
</div>
</div>

<footer>
© 2026 Chimiste BOUJEMÂA Rachida — Tous droits réservés<br>
Ras Jebel Jobs — منصة الوظائف المحلية
</footer>

<script>
const URL="https://gkiynoqovpuzudzpnryn.supabase.co";

async function loadJobs(){

try{

const response=await fetch(
URL+"/rest/v1/jobs?status=eq.active&select=*",
{
headers:{
"Content-Type":"application/json"
}
}
);

const jobs=await response.json();

if(!response.ok){
throw new Error("Erreur");
}

if(jobs.length===0){
document.getElementById("jobs").innerHTML=
"لا توجد عروض شغل حاليًا.";
return;
}

document.getElementById("jobs").innerHTML=
jobs.map(job=>`
<div class="card">
<h3>${job.title}</h3>
<p>📍 ${job.location||""}</p>
<p>📄 ${job.contract_type||""}</p>
<p>🎓 ${job.experience||""}</p>
<p>${job.description||""}</p>
<button onclick="applyJob('${job.id}')">
📩 تقديم الترشح
</button>
</div>
`).join("");

}catch(e){

document.getElementById("jobs").innerHTML=
"❌ تعذر تحميل عروض الشغل";

console.error(e);

}

}

function applyJob(jobId){
alert("📩 سيتم تفعيل الترشح في الخطوة التالية.");
}

loadJobs();
</script>

</body>
</html>
