<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>فضاء الباحث عن عمل | Ras Jebel Jobs</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fa;
      color: #1f2937;
    }

    header {
      background: #111827;
      color: white;
      padding: 25px 20px;
      text-align: center;
    }

    header h1 {
      margin: 0 0 8px;
      font-size: 28px;
    }

    header p {
      margin: 0;
      color: #d1d5db;
    }

    .container {
      max-width: 1000px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .welcome {
      background: white;
      border-radius: 16px;
      padding: 25px;
      margin-bottom: 25px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.06);
    }

    .welcome h2 {
      margin-top: 0;
    }

    .jobs-title {
      margin-bottom: 20px;
    }

    #jobs {
      display: grid;
      gap: 20px;
    }

    .job-card {
      background: white;
      border-radius: 16px;
      padding: 22px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.07);
      border-right: 5px solid #111827;
    }

    .job-card h3 {
      margin-top: 0;
      color: #111827;
    }

    .job-info {
      margin: 8px 0;
    }

    .apply-btn {
      margin-top: 15px;
      padding: 12px 20px;
      border: none;
      border-radius: 10px;
      background: #111827;
      color: white;
      cursor: pointer;
      font-size: 15px;
    }

    .apply-btn:hover {
      opacity: 0.85;
    }

    .message-box {
      margin-top: 12px;
      width: 100%;
      min-height: 90px;
      padding: 10px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      resize: vertical;
    }

    .loading {
      background: white;
      padding: 25px;
      border-radius: 15px;
      text-align: center;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
      padding: 20px;
      border-radius: 12px;
    }

    footer {
      margin-top: 50px;
      background: #111827;
      color: white;
      text-align: center;
      padding: 25px 15px;
      line-height: 1.8;
    }

    footer span {
      color: #d1d5db;
    }
  </style>
</head>

<body>

<header>
