<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>فضاء الباحث عن عمل | Ras Jebel Jobs</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{
    font-family:Arial,sans-serif;
    max-width:900px;
    margin:auto;
    padding:20px;
    background:#f5f7fa;
}
h1{text-align:center;}
.job{
    background:white;
    padding:20px;
    margin:15px 0;
    border-radius:12px;
    box-shadow:0 2px 8px #ddd;
}
button{
    padding:10px 18px;
    border:0;
    border-radius:8px;
    cursor:pointer;
}
</style>
</head>

<body>

<h1>👤 فضاء الباحث عن عمل</h1>
<p>حضّر ملفك المهني وابدأ في البحث عن فرصتك.</p>

<h2>💼 عروض الشغل المتاحة</h2>

<div id="jobs">
    جاري تحميل عروض الشغل...
</div>

<script>

const SUPABASE_URL = "https://gkiynoqovpuzudzpnryn.supabase.co";
const SUPABASE_ANON_KEY = "ضع_مفتاح_Supabase_هنا";

const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
);

async function loadJobs(){

    const { data, error } = await supabaseClient
        .from("jobs")
        .select("id,title,description,location,status,experience,contract_type")
        .eq("status","active")
        .order("created_at",{ascending:false});

    const container = document.getElementById("jobs");

    if(error){
        container.innerHTML =
        "<p>❌ صار مشكل في تحميل عروض الشغل.</p>";
        console.error(error);
        return;
    }

    if(!data || data.length === 0){
        container.innerHTML =
        "<p>لا توجد عروض شغل متاحة حاليًا.</p>";
        return;
    }

    container.innerHTML = "";

    data.forEach(job => {

        container.innerHTML += `
        <div class="job">

            <h3>🧪 ${job.title}</h3>

            <p>📍 ${job.location || ""}</p>

            <p>💼 ${job.contract_type || ""}</p>

            <p>👩‍🔬 ${job.experience || ""}</p>

            <p>${job.description || ""}</p>

            <button onclick="applyJob('${job.id}')">
                📩 ترشح للعرض
            </button>

        </div>
        `;

    });
}

function applyJob(jobId){
    alert("✅ تم تسجيل ترشحك المبدئي للعرض!");
}

loadJobs();

</script>

</body>
</html>
