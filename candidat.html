<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>فضاء الباحث عن عمل | Ras Jebel Jobs</title>
</head>

<body>

<h1>👤 فضاء الباحث عن عمل</h1>

<p>حضّر ملفك المهني وابدأ في البحث عن فرصتك.</p>

<h2>📝 معلوماتي</h2>

<label>الإسم واللقب</label><br>
<input type="text" id="name"><br><br>

<label>البريد الإلكتروني</label><br>
<input type="email" id="email"><br><br>

<label>رقم الهاتف</label><br>
<input type="tel" id="phone"><br><br>

<label>الاختصاص</label><br>
<input type="text" id="speciality"><br><br>

<label>المهارات</label><br>
<textarea id="skills"></textarea><br><br>

<button onclick="saveProfile()">💾 حفظ الملف</button>

<p id="message"></p>

<script>
function saveProfile(){
document.getElementById("message").innerText =
"✅ تم حفظ الملف الشخصي بنجاح!";
}
</script>

</body>
<h2>📄 CV متاعي</h2>

<p>اختار الـCV من الهاتف متاعك:</p>

<input type="file" id="cv" accept=".pdf,.doc,.docx">

<br><br>

<button onclick="saveCV()">📤 إضافة الـCV</button>

<p id="cvMessage"></p>

<script>
function saveCV(){
    const file = document.getElementById("cv").files[0];

    if(!file){
        alert("⚠️ اختار ملف CV أولاً");
        return;
    }

    document.getElementById("cvMessage").innerText =
    "✅ تم اختيار الـCV: " + file.name;
}
</script>
</html>
