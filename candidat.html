<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Ras Jebel Jobs | فضاء الباحث عن عمل</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f7fa;
      margin: 0;
      color: #222;
    }

    header {
      background: #17324d;
      color: white;
      text-align: center;
      padding: 30px 15px;
    }

    header h1 {
      margin: 0 0 10px;
    }

    main {
      max-width: 900px;
      margin: 30px auto;
      padding: 0 15px;
    }

    .section-title {
      color: #17324d;
      margin-top: 35px;
      margin-bottom: 20px;
    }

    .job,
    .application-card {
      background: white;
      border-radius: 14px;
      padding: 22px;
      margin-bottom: 20px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    .job h3,
    .application-card h3 {
      margin-top: 0;
      color: #17324d;
      font-size: 22px;
    }

    .info {
      margin: 8px 0;
      color: #444;
      line-height: 1.6;
    }

    .job p {
      line-height: 1.7;
    }

    .apply-area {
      margin-top: 20px;
      padding-top: 18px;
      border-top: 1px solid #eee;
    }

    .cv-label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
    }

    .cv-input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      background: #fafafa;
      margin-bottom: 12px;
    }

    .message-input {
      width: 100%;
      min-height: 90px;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      resize: vertical;
      font-family: Arial, sans-serif;
      margin-bottom: 12px;
    }

    .apply-button {
      background: #17324d;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
      width: 100%;
    }

    .apply-button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .success {
      background: #ecfdf5;
      color: #047857;
      padding: 12px;
      border-radius: 8px;
      margin-top: 12px;
    }

    .warning {
      background: #fff7ed;
      color: #c2410c;
      padding: 12px;
      border-radius: 8px;
      margin-top: 12px;
    }

    .error {
      background: #fef2f2;
      color: #b91c1c;
      padding: 12px;
      border-radius: 8px;
      margin-top: 12px;
    }

    .status {
      display: inline-block;
      padding: 9px 14px;
      border-radius: 9px;
      font-weight: bold;
      margin-top: 12px;
    }

    .pending {
      background: #fff7ed;
      color: #c2410c;
    }

    .accepted {
      background: #dcfce7;
      color: #166534;
    }

    .rejected {
      background: #fee2e2;
      color: #991b1b;
    }

    .cv-link {
      display: block;
      text-align: center;
      text-decoration: none;
      background: #17324d;
      color: white;
      padding: 12px;
      border-radius: 8px;
      margin-top: 15px;
      font-weight: bold;
    }

    .empty {
      background: white;
      padding: 20px;
      border-radius: 14px;
      text-align: center;
      color: #666;
      box-shadow: 0 3px 12px rgba(0,0,0,0.06);
    }

    #message {
      text-align: center;
      padding: 20px;
      font-size: 18px;
    }

    footer {
      text-align: center;
      padding: 25px;
      margin-top: 40px;
      background: #17324d;
      color: white;
      line-height: 1.8;
    }
  </style>
</head>

<body>

<header>
  <h1>👤 فضاء الباحث عن عمل</h1>
  <p>Ras Jebel Jobs</p>
</header>

<main>

  <h2 class="section-title">💼 عروض الشغل المتاحة</h2>

  <div id="message">
    جاري تحميل العروض...
  </div>

  <div id="jobs"></div>

  <h2 class="section-title">📋 ترشحـاتي</h2>

  <div id="myApplications">
    جاري تحميل ترشحاتك...
  </div>

</main>

<footer>
  © 2026 Chimiste BOUJEMÂA Rachida — Tous droits réservés<br>
  Ras Jebel Jobs — منصة الوظائف المحلية
</footer>

<script>

const SUPABASE_URL =
  "https://gkiynoqovpuzudzpnryn.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_cUc4p8AVQ6pHfI0oQT-PLA_Kt-5dhdw";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


async function loadJobs() {

  const message =
    document.getElementById("message");

  const jobsContainer =
    document.getElementById("jobs");

  const {
    data: jobs,
    error
  } = await supabaseClient
    .from("jobs")
    .select(
      "id,title,description,location,contract_type,experience"
    )
    .eq("status", "active")
    .order("created_at", {
      ascending: false
    });

  if (error) {

    console.error(error);

    message.innerHTML =
      '<div class="error">❌ تعذر تحميل عروض الشغل</div>';

    return;
  }

  if (!jobs || jobs.length === 0) {

    message.innerHTML =
      "📭 ما فماش عروض شغل متاحة حاليا";

    return;
  }

  message.innerHTML = "";

  jobsContainer.innerHTML =
    jobs.map(job => `

      <div class="job">

        <h3>
          ${job.title || ""}
        </h3>

        <div class="info">
          📍 ${job.location || "غير محدد"}
        </div>

        <div class="info">
          📄 ${job.contract_type || "غير محدد"}
        </div>

        <div class="info">
          🎓 ${job.experience || "غير محدد"}
        </div>

        <p>
          ${job.description || ""}
        </p>

        <div class="apply-area">

          <label class="cv-label">
            📄 CV متاعك — PDF فقط
          </label>

          <input
            type="file"
            id="cv-${job.id}"
            class="cv-input"
            accept=".pdf,application/pdf"
          >

          <label class="cv-label">
            💬 رسالة للمؤسسة — اختيارية
          </label>

          <textarea
            id="message-${job.id}"
            class="message-input"
            placeholder="اكتب رسالة قصيرة للمؤسسة..."
          ></textarea>

          <button
            class="apply-button"
            id="button-${job.id}"
            onclick="applyJob('${job.id}')"
          >
            📩 تقديم الترشح
          </button>

          <div id="result-${job.id}"></div>

        </div>

      </div>

    `).join("");
}


async function applyJob(jobId) {

  const button =
    document.getElementById(`button-${jobId}`);

  const result =
    document.getElementById(`result-${jobId}`);

  const cvInput =
    document.getElementById(`cv-${jobId}`);

  const messageInput =
    document.getElementById(`message-${jobId}`);

  result.innerHTML = "";


  const {
    data: { user },
    error: userError
  } = await supabaseClient.auth.getUser();


  if (userError || !user) {

    alert("⚠️ يلزمك تسجيل الدخول أولا");

    window.location.href = "auth.html";

    return;
  }


  if (!cvInput.files || cvInput.files.length === 0) {

    result.innerHTML =
      '<div class="warning">⚠️ لازم تختار CV بصيغة PDF قبل تقديم الترشح.</div>';

    return;
  }


  const cvFile =
    cvInput.files[0];


  if (
    cvFile.type !== "application/pdf" &&
    !cvFile.name.toLowerCase().endsWith(".pdf")
  ) {

    result.innerHTML =
      '<div class="error">❌ مسموح كان ملفات PDF.</div>';

    return;
  }


  if (cvFile.size > 5 * 1024 * 1024) {

    result.innerHTML =
      '<div class="error">❌ حجم الـCV لازم يكون أقل من 5 MB.</div>';

    return;
  }


  button.disabled = true;

  button.textContent =
    "⏳ جاري تقديم الترشح...";


  try {

    const {
      data: existingApplication,
      error: existingError
    } = await supabaseClient
      .from("applications")
      .select("id")
      .eq("job_id", jobId)
      .eq("candidate_id", user.id)
      .maybeSingle();


    if (existingError) {

      console.error(existingError);

      throw new Error(
        "تعذر التثبت من الترشح السابق."
      );
    }


    if (existingApplication) {

      result.innerHTML =
        '<div class="warning">⚠️ إنتِ سبق وقدّمتِ ترشحك لهذا العرض.</div>';

      button.disabled = false;

      button.textContent =
        "📩 تقديم الترشح";

      return;
    }


    const fileName =
      `${user.id}/${jobId}-${Date.now()}.pdf`;


    const {
      error: uploadError
    } = await supabaseClient
      .storage
      .from("cvs")
      .upload(
        fileName,
        cvFile,
        {
          contentType: "application/pdf",
          upsert: false
        }
      );


    if (uploadError) {

      console.error(uploadError);

      throw new Error(
        "تعذر رفع الـCV. تأكدي من إعدادات Storage."
      );
    }


    const {
      data: publicUrlData
    } = supabaseClient
      .storage
      .from("cvs")
      .getPublicUrl(fileName);


    const cvUrl =
      publicUrlData.publicUrl;


    const candidateMessage =
      messageInput.value.trim();


    const {
      error: applicationError
    } = await supabaseClient
      .from("applications")
      .insert({

        job_id: jobId,

        candidate_id: user.id,

        cv_url: cvUrl,

        message: candidateMessage,

        status: "pending"

      });


    if (applicationError) {

      console.error(applicationError);

      await supabaseClient
        .storage
        .from("cvs")
        .remove([fileName]);


      if (
        applicationError.code === "23505"
      ) {

        throw new Error(
          "إنتِ سبق وقدّمتِ ترشحك لهذا العرض."
        );
      }

      throw new Error(
        applicationError.message
      );
    }


    result.innerHTML =
      '<div class="success">✅ تم تقديم ترشحك بنجاح ❤️<br>📄 تم رفع الـCV للمؤسسة.</div>';


    button.textContent =
      "✅ تم تقديم الترشح";

    cvInput.disabled = true;

    messageInput.disabled = true;


    loadMyApplications();

  } catch (error) {

    console.error(error);

    result.innerHTML =
      `<div class="error">❌ ${error.message}</div>`;

    button.disabled = false;

    button.textContent =
      "📩 تقديم الترشح";
  }
}


async function loadMyApplications() {

  const container =
    document.getElementById("myApplications");


  const {
    data: { user },
    error: userError
  } = await supabaseClient.auth.getUser();


  if (userError || !user) {

    container.innerHTML =
      '<div class="warning">🔐 سجّل الدخول باش تشوف ترشحاتك.</div>';

    return;
  }


  const {
    data: applications,
    error: applicationsError
  } = await supabaseClient
    .from("applications")
    .select(
      "id,job_id,cv_url,message,status,created_at"
    )
    .eq("candidate_id", user.id)
    .order("created_at", {
      ascending: false
    });


  if (applicationsError) {

    console.error(applicationsError);

    container.innerHTML =
      '<div class="error">❌ تعذر تحميل ترشحاتك.</div>';

    return;
  }


  if (!applications || applications.length === 0) {

    container.innerHTML =
      '<div class="empty">📭 ما قدمتش على حتى عرض شغل توّا.</div>';

    return;
  }


  const jobIds =
    [...new Set(
      applications.map(app => app.job_id)
    )];


  const {
    data: jobs,
    error: jobsError
  } = await supabaseClient
    .from("jobs")
    .select(
      "id,title,location,contract_type,experience"
    )
    .in("id", jobIds);


  if (jobsError) {

    console.error(jobsError);

    container.innerHTML =
      '<div class="error">❌ تعذر تحميل تفاصيل العروض.</div>';

    return;
  }


  const jobMap = {};

  (jobs || []).forEach(job => {
    jobMap[job.id] = job;
  });


  container.innerHTML =
    applications.map(app => {

      const job =
        jobMap[app.job_id];

      let statusText =
        "🟡 قيد الدراسة";

      let statusClass =
        "pending";


      if (app.status === "accepted") {

        statusText =
          "🟢 مقبول";

        statusClass =
          "accepted";

      } else if (app.status === "rejected") {

        statusText =
          "🔴 مرفوض";

        statusClass =
          "rejected";
      }


      const date =
        new Date(
          app.created_at
        ).toLocaleDateString(
          "fr-FR"
        );


      return `

        <div class="application-card">

          <h3>
            💼 ${job?.title || "عرض شغل"}
          </h3>

          <div class="info">
            📍 ${job?.location || "غير محدد"}
          </div>

          <div class="info">
            📄 ${job?.contract_type || "غير محدد"}
          </div>

          <div class="info">
            🎓 ${job?.experience || "غير محدد"}
          </div>

          <div class="info">
            📅 تاريخ الترشح: ${date}
          </div>

          <div class="status ${statusClass}">
            ${statusText}
          </div>

          ${
            app.cv_url
            ?
            `
              <a
                href="${app.cv_url}"
                target="_blank"
                rel="noopener noreferrer"
                class="cv-link"
              >
                📄 فتح الـCV المرسل
              </a>
            `
            :
            ""
          }

        </div>

      `;

    }).join("");
}


loadJobs();
loadMyApplications();

</script>

</body>
</html>
