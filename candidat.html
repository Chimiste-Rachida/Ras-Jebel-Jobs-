
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>فضاء الباحث عن عمل | Ras Jebel Jobs</title>

<style>
body{font-family:Arial;background:#f4f7fb;margin:0;color:#172033}
header,footer{background:#123b5d;color:white;padding:20px;text-align:center}
main{max-width:800px;margin:30px auto;padding:15px}
.card{background:white;padding:25px;margin-bottom:20px;border-radius:15px}
input,textarea{width:100%;padding:12px;margin:8px 0 15px;box-sizing:border-box}
button{background:#123b5d;color:white;border:0;padding:12px 20px;border-radius:8px}
</style>
</head>

<body>

<header>
<h2>Ras Jebel Jobs</h2>
<a href="index.html" style="color:white">← الرئيسية</a>
</header>

<main>

<div class="card">
<h1>👤 فضاء الباحث عن عمل</h1>
<p>حضّر ملفك المهني وابدأ في البحث عن فرصتك.</p>
</div>

<div class="card">
<h2>📝 معلوماتي</h2>

<label>الإسم واللقب</label>
<input id="name" type="text" placeholder="اكتب اسمك ولقبك">

<label>البريد الإلكتروني</label>
<input id="email" type="email" placeholder="example@email.com">

<label>رقم الهاتف</label>
<input id="phone" type="tel" placeholder="XX XXX XXX">

<label>الاختصاص</label>
<input id="speciality" type="text" placeholder="مثال: Chimie industrielle">

<label>المهارات</label>
<textarea id="skills" placeholder="HPLC, GC, contrôle qualité..."></textarea>

<button onclick="saveProfile()">💾 حفظ الملف</button>

<p id="message" style="color:green"></p>
</div>

<div class="card">
<h2>📄 CV متاعي</h2>
<input type="file" accept=".pdf,.doc,.docx">
<button onclick="alert('✅ تم اختيار الـCV')">📤 إضافة الـCV</button>
</div>

<div class="card">
<h2>💼 عروض الشغل</h2>
<h3>🧪 Technicienne de laboratoire</h3>
<p>📍 رأس الجبل</p>
<button onclick="alert('✅ تم تسجيل ترشحك')">📩 ترشح للعرض</button>
</div>

</main>

<footer>
© 2026 Chimiste BOUJEMÂA Rachida — Tous droits réservés<br>
Ras Jebel Jobs — منصة الوظائف المحلية
</footer>

<script>
function saveProfile(){
localStorage.setItem("candidateName",document.getElementById("name").value);
document.getElementById("message").innerText="✅ تم حفظ الملف الشخصي بنجاح!";
}
</script>

</body>
</html>
