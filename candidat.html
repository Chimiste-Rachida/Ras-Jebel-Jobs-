<style>
*{

body{

}

header{
background:#123b5d;
color:white;
padding:18px 6%;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
font-size:23px;
font-weight:bold;
}

header a{
color:white;

}

.container{
max-width:1050px;
margin:40px auto;
padding:20px;
}

.welcome{
background:linear-gradient(135deg,#123b5d,#1f6f8b);

padding:40px;

}

.welcome h1{

.card{

padding:28px;

}

}

label{
display:block;
margin-top:12px;
font-weight:bold;
}

input,textarea{
width:100%;
padding:13px;
margin-top:7px;
border:1px solid #ddd;
border-radius:8px;
font-size:15px;
}

textarea{
height:100px;
}

button{
margin-top:20px;
padding:13px 22px;
border:0;
border-radius:9px;
background:#123b5d;
color:white;
font-weight:bold;
cursor:pointer;
}

button:hover{
opacity:.9;
}

.success{
display:none;
margin-top:18px;
padding:15px;
background:#e8f7ee;
color:#176b3a;
border-radius:9px;
font-weight:bold;
}

.job{
border:1px solid #ddd;
padding:18px;
border-radius:12px;
margin-top:15px;
}

.job h3{
color:#123b5d;
margin-bottom:8px;
}

.job p{
margin:6px 0;
color:#555;
}

footer{
background:#123b5d;
color:white;
text-align:center;
padding:25px;
margin-top:50px;
line-height:2;
}

@media(max-width:650px){
.welcome{
padding:25px;
}

header{
padding:15px 20px;
}

.container{
padding:15px;
}
}
</style>
