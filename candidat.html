<script>

const SUPABASE_URL =
  "https://gkiynoqovpuzudzpnryn.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_cUc4p8AVQ6pHfI0oQT-PLA_Kt-5dhdw";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


async function loadNotifications() {

  const container =
    document.getElementById("notifications");


  const {
    data: { user },
    error: userError
  } = await supabaseClient.auth.getUser();


  if (userError || !user) {

    container.innerHTML =
      '<div class="warning">🔐 سجّل الدخول باش تشوف إشعاراتك.</div>';

    return;
  }


  const {
    data: notifications,
    error
  } = await supabaseClient
    .from("notifications")
    .select(
      "id,title,message,is_read,created_at"
    )
    .eq("user_id", user.id)
    .order("created_at", {
      ascending: false
    });


  if (error) {

    console.error(error);

    container.innerHTML =
      '<div class="error">❌ تعذر تحميل الإشعارات.</div>';

    return;
  }


  if (!notifications || notifications.length === 0) {

    container.innerHTML =
      '<div class="empty">🔕 ما عندك حتى إشعار توّا.</div>';

    return;
  }


  container.innerHTML =
    notifications.map(notification => {

      const date =
        new Date(
          notification.created_at
        ).toLocaleString(
          "fr-FR"
        );


      return `

        <div
          class="notification ${
            notification.is_read
              ? ""
              : "unread"
          }"
        >

          <h3>
            ${notification.title || "🔔 إشعار"}
          </h3>

          <p>
            ${notification.message || ""}
          </p>

          <div class="notification-date">
            📅 ${date}
          </div>

          ${
            !notification.is_read
            ?
            `
              <button
                class="read-button"
                onclick="markNotificationRead('${notification.id}')"
              >
                ✓ تعليم كمقروء
              </button>
            `
            :
            `
              <div class="notification-date">
                ✓ تمت القراءة
              </div>
            `
          }

        </div>

      `;

    }).join("");
}


async function markNotificationRead(
  notificationId
) {

  const {
    error
  } = await supabaseClient
    .from("notifications")
    .update({
      is_read: true
    })
    .eq(
      "id",
      notificationId
    );


  if (error) {

    console.error(error);

    alert(
      "❌ تعذر تحديث الإشعار."
    );

    return;
  }


  loadNotifications();
}


async function loadJobs() {

  const message =
    document.getElementById("message");

  const jobsContainer =
    document.getElementById("jobs");


  const {
    data: jobs,
    error
  } = await supabaseClient
    .from("jobs")
    .select(
      "id,title,description,location,contract_type,experience"
    )
    .eq("status", "active")
    .order("created_at", {
      ascending: false
    });


  if (error) {

    console.error(error);

    message.innerHTML =
      '<div class="error">❌ تعذر تحميل عروض الشغل</div>';

    return;
  }


  if (!jobs || jobs.length === 0) {

    message.innerHTML =
      "📭 ما فماش عروض شغل متاحة حاليا";

    return;
  }


  message.innerHTML = "";


  jobsContainer.innerHTML =
    jobs.map(job => `

      <div class="job">

        <h3>
          ${job.title || ""}
        </h3>

        <div class="info">
          📍 ${job.location || "غير محدد"}
        </div>

        <div class="info">
          📄 ${job.contract_type || "غير محدد"}
        </div>

        <div class="info">
          🎓 ${job.experience || "غير محدد"}
        </div>

        <p>
          ${job.description || ""}
        </p>

        <div class="apply-area">

          <label class="cv-label">
            📄 CV متاعك — PDF فقط
          </label>

          <input
            type="file"
            id="cv-${job.id}"
            class="cv-input"
            accept=".pdf,application/pdf"
          >

          <label class="cv-label">
            💬 رسالة للمؤسسة — اختيارية
          </label>

          <textarea
            id="message-${job.id}"
            class="message-input"
            placeholder="اكتب رسالة قصيرة للمؤسسة..."
          ></textarea>

          <button
            class="apply-button"
            id="button-${job.id}"
            onclick="applyJob('${job.id}')"
          >
            📩 تقديم الترشح
          </button>

          <div id="result-${job.id}"></div>

        </div>

      </div>

    `).join("");
}


async function applyJob(jobId) {

  const button =
    document.getElementById(
      `button-${jobId}`
    );

  const result =
    document.getElementById(
      `result-${jobId}`
    );

  const cvInput =
    document.getElementById(
      `cv-${jobId}`
    );

  const messageInput =
    document.getElementById(
      `message-${jobId}`
    );


  result.innerHTML = "";


  const {
    data: { user },
    error: userError
  } = await supabaseClient.auth.getUser();


  if (userError || !user) {

    alert(
      "⚠️ يلزمك تسجيل الدخول أولا"
    );

    window.location.href =
      "auth.html";

    return;
  }


  if (
    !cvInput.files ||
    cvInput.files.length === 0
  ) {

    result.innerHTML =
      '<div class="warning">⚠️ لازم تختار CV بصيغة PDF قبل تقديم الترشح.</div>';

    return;
  }


  const cvFile =
    cvInput.files[0];


  if (
    cvFile.type !== "application/pdf" &&
    !cvFile.name
      .toLowerCase()
      .endsWith(".pdf")
  ) {

    result.innerHTML =
      '<div class="error">❌ مسموح كان ملفات PDF.</div>';

    return;
  }


  if (
    cvFile.size >
    5 * 1024 * 1024
  ) {

    result.innerHTML =
      '<div class="error">❌ حجم الـCV لازم يكون أقل من 5 MB.</div>';

    return;
  }


  button.disabled = true;

  button.textContent =
    "⏳ جاري تقديم الترشح...";


  try {

    const {
      data: existingApplication,
      error: existingError
    } = await supabaseClient
      .from("applications")
      .select("id")
      .eq("job_id", jobId)
      .eq(
        "candidate_id",
        user.id
      )
      .maybeSingle();


    if (existingError) {

      console.error(existingError);

      throw new Error(
        "تعذر التثبت من الترشح السابق."
      );
    }


    if (existingApplication) {

      result.innerHTML =
        '<div class="warning">⚠️ إنتِ سبق وقدّمتِ ترشحك لهذا العرض.</div>';

      button.disabled = false;

      button.textContent =
        "📩 تقديم الترشح";

      return;
    }


    const fileName =
      `${user.id}/${jobId}-${Date.now()}.pdf`;


    const {
      error: uploadError
    } = await supabaseClient
      .storage
      .from("cvs")
      .upload(
        fileName,
        cvFile,
        {
          contentType:
            "application/pdf",
          upsert: false
        }
      );


    if (uploadError) {

      console.error(uploadError);

      throw new Error(
        "تعذر رفع الـCV. تأكدي من إعدادات Storage."
      );
    }


    const {
      data: publicUrlData
    } = supabaseClient
      .storage
      .from("cvs")
      .getPublicUrl(
        fileName
      );


    const cvUrl =
      publicUrlData.publicUrl;


    const candidateMessage =
      messageInput.value.trim();


    const {
      error: applicationError
    } = await supabaseClient
      .from("applications")
      .insert({

        job_id: jobId,

        candidate_id: user.id,

        cv_url: cvUrl,

        message: candidateMessage,

        status: "pending"

      });


    if (applicationError) {

      console.error(
        applicationError
      );


      await supabaseClient
        .storage
        .from("cvs")
        .remove([
          fileName
        ]);


      if (
        applicationError.code ===
        "23505"
      ) {

        throw new Error(
          "إنتِ سبق وقدّمتِ ترشحك لهذا العرض."
        );
      }


      throw new Error(
        applicationError.message
      );
    }


    result.innerHTML =
      '<div class="success
