<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Ras Jebel Jobs — منصة الوظائف المحلية</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Tahoma, sans-serif;
      background: #f4f7fb;
      color: #172033;
    }

    header {
      background: linear-gradient(135deg, #0b3d91, #1677c8);
      color: white;
      padding: 18px 20px;
      box-shadow: 0 3px 12px rgba(0,0,0,.12);
    }

    .header-inner {
      max-width: 1100px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    .logo {
      font-size: 25px;
      font-weight: bold;
    }

    .tunisia {
      font-size: 14px;
      opacity: .9;
    }

    nav {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    nav a {
      color: white;
      text-decoration: none;
      padding: 9px 13px;
      border-radius: 8px;
      background: rgba(255,255,255,.13);
      font-size: 14px;
    }

    .hero {
      min-height: 430px;
      padding: 70px 20px;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;

      background:
        linear-gradient(
          rgba(255,255,255,.78),
          rgba(255,255,255,.84)
        ),
        url("ras-jebel-jobs-hero.jpg")
        center center / cover no-repeat;
    }

    .hero h1 {
      margin: 0 0 15px;
      font-size: 38px;
      color: #0b3d91;
    }

    .hero p {
      font-size: 19px;
      color: #526071;
      margin-bottom: 28px;
    }

    .hero-buttons {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-block;
      text-decoration: none;
      border: none;
      cursor: pointer;
      padding: 13px 22px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
    }

    .btn-primary {
      background: #0b3d91;
      color: white;
    }
