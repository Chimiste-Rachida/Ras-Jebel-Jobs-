<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>فضاء المؤسسة — Ras Jebel Jobs</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fa;
      color: #222;
    }

    header {
      background: #17324d;
      color: white;
      padding: 30px 20px;
      text-align: center;
    }

    header h1 {
      margin: 0 0 10px;
    }

    .container {
      max-width: 1000px;
      margin: 30px auto;
      padding: 0 15px;
    }

    .card {
      background: white;
      padding: 25px;
      margin-bottom: 20px;
      border-radius: 14px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    .job {
      border: 1px solid #ddd;
      padding: 20px;
      border-radius: 12px;
      margin-top: 15px;
    }

    .job h3 {
      margin-top: 0;
      color: #17324d;
    }

    .btn {
      padding: 11px 18px;
      margin-top: 12px;
      background: #17324d;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
    }

    .btn:hover {
      opacity: 0.9;
    }

    .error {
      color: #b00020;
      font-weight: bold;
    }

    .success {
      color: #16803c;
      font-weight: bold;
    }

    footer {
      text-align: center;
      padding: 25px;
      margin-top: 40px;
      background: #17324d;
      color: white;
    }
  </style>
</head>

<body>

<header>
  <h1>🏢 فضاء المؤسسة</h1>
  <p>Ras Jebel Jobs</p>
</header>

<div class="container">

  <div class="card">
    <h2>👋 مرحباً بالمؤسسة</h2>
    <p>من هنا تنجم المؤسسة تتابع عروض العمل والترشحات.</p>

    <div id="companyInfo">
      جاري تحميل معلومات المؤسسة...
    </div>
  </div>

  <div class="card">
    <h2>💼 عروض العمل متاع المؤسسة</h2>

    <div id="jobs">
      جاري تحميل العروض...
    </div>
  </div>

</div>

<footer>
  © 2026 Chimiste BOUJEMÂA Rachida — Tous droits réservés<br>
  Ras Jebel Jobs — منصة الوظائف المحلية
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
  "https://gkiynoqovpuzudzpnryn.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_cUc4p8AVQ6pHfI0oQT-PLA_Kt-5dhdw";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


async function loadCompany() {

  const companyInfo =
    document.getElementById("companyInfo");

  const jobs =
    document.getElementById("jobs");

  try {

    const {
      data: { user },
      error: authError
    } = await supabaseClient.auth.getUser();

    if (authError) {
      console.error(authError);

      companyInfo.innerHTML =
        '<p class="error">❌ تعذر التحقق من تسجيل الدخول.</p>';

      return;
    }

    if (!user) {

      companyInfo.innerHTML =
        '<p class="error">⚠️ يلزمك تسجيل الدخول أولا.</p>';

      jobs.innerHTML =
        "سجّل الدخول كمسؤول مؤسسة لرؤية العروض.";

      return;
    }


    const {
      data: company,
      error: companyError
    } = await supabaseClient
      .from("companies")
      .select(`
        id,
        company_name,
        description,
        phone,
        email,
        location
      `)
      .eq("owner_id", user.id)
      .limit(1)
      .maybeSingle();


    if (companyError) {

      console.error(companyError);

      companyInfo.innerHTML =
        '<p class="error">❌ تعذر تحميل معلومات المؤسسة.</p>';

      return;
    }


    if (!company) {

      companyInfo.innerHTML =
        '<p class="error">⚠️ ما فماش مؤسسة مربوطة بهذا الحساب.</p>';

      jobs.innerHTML =
        "ما فماش مؤسسة مرتبطة بحساب الدخول الحالي.";

      return;
    }


    companyInfo.innerHTML = `

      <p class="success">
        ✅ تم تحميل معلومات المؤسسة بنجاح
      </p>

      <p>
        <strong>🏢 اسم المؤسسة:</strong>
        ${escapeHtml(company.company_name || "")}
      </p>

      ${
        company.location
          ? `<p>📍 <strong>الموقع:</strong> ${escapeHtml(company.location)}</p>`
          : ""
      }

      ${
        company.email
          ? `<p>📧 <strong>Email:</strong> ${escapeHtml(company.email)}</p>`
          : ""
      }

      ${
        company.phone
          ? `<p>📞 <strong>Téléphone:</strong> ${escapeHtml(company.phone)}</p>`
          : ""
      }

    `;


    await loadJobs(company.id);

  } catch (error) {

    console.error(error);

    companyInfo.innerHTML =
      '<p class="error">❌ صار خطأ أثناء تحميل البيانات.</p>';

    jobs.innerHTML =
      '<p class="error">❌ تعذر تحميل العروض.</p>';
  }
}


async function loadJobs(companyId) {

  const jobsContainer =
    document.getElementById("jobs");


  const {
    data,
    error
  } = await supabaseClient
    .from("jobs")
    .select(`
      id,
      title,
      description,
      location,
      contract_type,
      experience,
      status,
      created_at
    `)
    .eq("company_id", companyId)
    .order("created_at", {
      ascending: false
    });


  if (error) {

    console.error(error);

    jobsContainer.innerHTML =
      '<p class="error">❌ تعذر تحميل عروض العمل.</p>';

    return;
  }


  if (!data || data.length === 0) {

    jobsContainer.innerHTML =
      "ما فماش عروض عمل منشورة حاليا.";

    return;
  }


  jobsContainer.innerHTML = data.map(job => `

    <div class="job">

      <h3>
        💼 ${escapeHtml(job.title || "بدون عنوان")}
      </h3>

      <p>
        📍 <strong>المكان:</strong>
        ${escapeHtml(job.location || "غير محدد")}
      </p>

      <p>
        📄 <strong>نوع العقد:</strong>
        ${escapeHtml(job.contract_type || "غير محدد")}
      </p>

      <p>
        🎓 <strong>الخبرة:</strong>
        ${escapeHtml(job.experience || "غير محدد")}
      </p>

      <p>
        ${escapeHtml(job.description || "")}
      </p>

      <p>
        <strong>الحالة:</strong>

        ${
          job.status === "active"
            ? "🟢 نشط"
            : "🔴 مغلق"
        }
      </p>

      <button
        class="btn"
        onclick="viewApplications('${job.id}')">

        👥 الترشحات

      </button>

    </div>

  `).join("");
}


function viewApplications(jobId) {

  window.location.href =
    "candidatures-entreprise.html?job_id=" +
    encodeURIComponent(jobId);
}


function escapeHtml(value) {

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


loadCompany();

</script>

</body>
</html>
