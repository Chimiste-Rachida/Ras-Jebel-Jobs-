<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>فضاء المؤسسة — Ras Jebel Jobs</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fa;
      color: #222;
    }

    header {
      background: #17324d;
      color: white;
      padding: 30px 20px;
      text-align: center;
    }

    header h1 {
      margin: 0 0 10px;
    }

    .container {
      max-width: 1000px;
      margin: 30px auto;
      padding: 0 15px;
    }

    .card {
      background: white;
      padding: 25px;
      margin-bottom: 20px;
      border-radius: 14px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    .job {
      border: 1px solid #ddd;
      padding: 20px;
      border-radius: 12px;
      margin-top: 15px;
    }

    .job h3 {
      margin-top: 0;
      color: #17324d;
    }

    .btn {
      padding: 11px 18px;
      margin-top: 12px;
      background: #17324d;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
    }

    footer {
      text-align: center;
      padding: 25px;
      margin-top: 40px;
      background: #17324d;
      color: white;
    }
  </style>
</head>

<body>

<header>
  <h1>🏢 فضاء المؤسسة</h1>
  <p>Ras Jebel Jobs</p>
</header>

<div class="container">

  <div class="card">
    <h2>👋 مرحباً بالمؤسسة</h2>
    <p>من هنا تنجم المؤسسة تتابع عروض العمل والترشحات.</p>

    <div id="companyInfo">
      جاري تحميل معلومات المؤسسة...
    </div>
  </div>

  <div class="card">
    <h2>💼 عروض العمل متاع المؤسسة</h2>

    <div id="jobs">
      جاري تحميل العروض...
    </div>
  </div>

</div>

<footer>
  © 2026 Chimiste BOUJEMÂA Rachida — Tous droits réservés<br>
  Ras Jebel Jobs — منصة الوظائف المحلية
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
  "https://gkiynoqovpuzudzpnryn.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_cUc4p8AVQ6pHfI0oQT-PLA_Kt-5dhdw";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


async function loadCompany() {

  const {
    data: { user },
    error
  } = await supabaseClient.auth.getUser();

  if (error || !user) {
    companyInfo.innerHTML =
      "⚠️ يلزمك تسجيل الدخول أولا.";
    return;
  }

  const { data, error: companyError } =
    await supabaseClient
      .from("companies")
      .select("id, company_name")
      .eq("owner_id", user.id)
      .limit(1)
      .maybeSingle();

  if (companyError) {
    companyInfo.innerHTML =
      "❌ تعذر تحميل معلومات المؤسسة.";
    console.error(companyError);
    return;
  }

  if (!data) {
    companyInfo.innerHTML =
      "⚠️ ما فماش مؤسسة مربوطة بهذا الحساب.";
    return;
  }

  companyInfo.innerHTML =
    "<strong>🏢 اسم المؤسسة:</strong> " +
    data.company_name;

  loadJobs(data.id);
}


async function loadJobs(companyId) {

  const { data, error } =
    await supabaseClient
      .from("jobs")
      .select(`
        id,
        title,
        description,
        location,
        contract_type,
        experience,
        status,
        created_at
      `)
      .eq("company_id", companyId)
      .order("created_at", { ascending: false });

  if (error) {
    jobs.innerHTML =
      "❌ تعذر تحميل عروض العمل.";
    console.error(error);
    return;
  }

  if (!data || data.length === 0) {
    jobs.innerHTML =
      "ما فماش عروض عمل منشورة حاليا.";
    return;
  }

  jobs.innerHTML = data.map(job => `

    <div class="job">

      <h3>${job.title}</h3>

      <p>📍 ${job.location || ""}</p>

      <p>📄 ${job.contract_type || ""}</p>

      <p>🎓 ${job.experience || ""}</p>

      <p>${job.description || ""}</p>

      <p>
        الحالة:
        <strong>
          ${
            job.status === "active"
              ? "🟢 نشط"
              : "🔴 مغلق"
          }
        </strong>
      </p>

      <button
        class="btn"
        onclick="viewApplications('${job.id}')">
        👥 الترشحات
      </button>

    </div>

  `).join("");
}


function viewApplications(jobId) {
  window.location.href =
    "candidatures-entreprise.html?job_id=" +
    encodeURIComponent(jobId);
}
}


loadCompany().catch(error => {
  console.error(error);
  document.getElementById("companyInfo").innerHTML =
    "❌ صار خطأ أثناء تحميل المؤسسة: " + (error.message || error);
});

</script>

</body>
</html>
