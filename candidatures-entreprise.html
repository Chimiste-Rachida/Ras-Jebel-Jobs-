<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ترشحات المؤسسة | Ras Jebel Jobs</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fa;
      color: #1f2937;
    }

    header {
      background: linear-gradient(135deg, #111827, #374151);
      color: white;
      padding: 30px 20px;
      text-align: center;
    }

    header h1 {
      margin: 0 0 8px;
    }

    main {
      max-width: 1000px;
      margin: 30px auto;
      padding: 0 16px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 22px;
      margin-bottom: 20px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    .candidate-name {
      font-size: 21px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .info {
      margin: 8px 0;
      color: #4b5563;
    }

    .message {
      background: #f9fafb;
      border-right: 4px solid #374151;
      padding: 12px;
      margin: 15px 0;
      border-radius: 8px;
    }

    .status {
      display: inline-block;
      padding: 7px 12px;
      border-radius: 20px;
      font-weight: bold;
      margin: 8px 0;
    }

    .pending {
      background: #fff7ed;
      color: #c2410c;
    }

    .accepted {
      background: #ecfdf5;
      color: #047857;
    }

    .rejected {
      background: #fef2f2;
      color: #b91c1c;
    }

    .buttons {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 15px;
    }

    button {
      border: none;
      padding: 11px 18px;
      border-radius: 9px;
      cursor: pointer;
      font-size: 15px;
      font-weight: bold;
    }

    .accept {
      background: #16a34a;
      color: white;
    }

    .reject {
      background: #dc2626;
      color: white;
    }

    .empty {
      text-align: center;
      padding: 40px;
      color: #6b7280;
    }

    .error {
      color: #b91c1c;
      text-align: center;
      padding: 20px;
      font-weight: bold;
    }

    footer {
      text-align: center;
      padding: 30px 15px;
      margin-top: 40px;
      color: #6b7280;
      font-size: 14px;
    }
  </style>
</head>

<body>

<header>
  <h1>👥 ترشحات المؤسسة</h1>
  <p>Ras Jebel Jobs</p>
</header>

<main>
  <div id="message"></div>
  <div id="applications"></div>
</main>

<footer>
  © 2026 Chimiste BOUJEMÂA Rachida — Tous droits réservés<br>
  Ras Jebel Jobs — منصة الوظائف المحلية
</footer>

<script>
  const SUPABASE_URL = "https://gkiynoqovpuzudzpnryn.supabase.co";
  const SUPABASE_KEY = "sb_publishable_cUc4p8AVQ6pHfI0oQT-PLA_Kt-5dhdw";

  const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

  async function loadApplications() {

    const messageBox = document.getElementById("message");
    const container = document.getElementById("applications");

    const {
      data: { user },
      error: userError
    } = await supabaseClient.auth.getUser();

    if (userError || !user) {
      messageBox.innerHTML =
        '<div class="error">⚠️ يلزم تسجيل الدخول أولا.</div>';
      return;
    }

    // المؤسسة المرتبطة بالحساب الحالي
    const { data: company, error: companyError } =
      await supabaseClient
        .from("companies")
        .select("id, company_name")
        .eq("owner_id", user.id)
        .eq("id", "03b2aa14-850c-4ba4-8101-713c778070cc")
        .maybeSingle();

    if (companyError) {
      console.error(companyError);
      messageBox.innerHTML =
        '<div class="error">❌ تعذر تحميل معلومات المؤسسة.</div>';
      return;
    }

    if (!company) {
      messageBox.innerHTML =
        '<div class="error">⚠️ المؤسسة غير مربوطة بهذا الحساب.</div>';
      return;
    }

    // نجيب العروض متاع المؤسسة
    const { data: jobs, error: jobsError } =
      await supabaseClient
        .from("jobs")
        .select("id, title")
        .eq("company_id", company.id);

    if (jobsError) {
      console.error(jobsError);
      messageBox.innerHTML =
        '<div class="error">❌ تعذر تحميل عروض العمل.</div>';
      return;
    }

    if (!jobs || jobs.length === 0) {
      messageBox.innerHTML =
        '<div class="card empty">📭 ما فماش عروض عمل للمؤسسة.</div>';
      return;
    }

    const jobIds = jobs.map(job => job.id);

    // نجيب الترشحات
    const { data: applications, error: applicationsError } =
      await supabaseClient
        .from("applications")
        .select("id, job_id, candidate_id, message, status, created_at, cv_url")
        .in("job_id", jobIds)
        .order("created_at", { ascending: false });

    if (applicationsError) {
      console.error(applicationsError);
      messageBox.innerHTML =
        '<div class="error">❌ تعذر تحميل الترشحات.</div>';
      return;
    }

    messageBox.innerHTML = `
      <div class="card">
        <strong>🏢 المؤسسة:</strong> ${company.company_name}
        <br><br>
        <strong>📊 عدد الترشحات:</strong> ${applications.length}
      </div>
    `;

    if (applications.length === 0) {
      container.innerHTML =
        '<div class="card empty">📭 ما فماش ترشحات حاليا.</div>';
      return;
    }

    // نجيب بيانات المترشحين
    const candidateIds = [
      ...new Set(applications.map(app => app.candidate_id))
    ];

    const { data: profiles, error: profilesError } =
      await supabaseClient
        .from("profiles")
        .select("id, full_name, phone")
        .in("id", candidateIds);

    if (profilesError) {
      console.error(profilesError);
      messageBox.innerHTML =
        '<div class="error">❌ تعذر تحميل معلومات المترشحين.</div>';
      return;
    }

    const profileMap = {};
    profiles.forEach(profile => {
      profileMap[profile.id] = profile;
    });

    const jobMap = {};
    jobs.forEach(job => {
      jobMap[job.id] = job;
    });

    container.innerHTML = applications.map(app => {

      const profile = profileMap[app.candidate_id] || {};
      const job = jobMap[app.job_id] || {};

      let statusClass = "pending";
      let statusText = "🟡 قيد الدراسة";

      if (app.status === "accepted") {
        statusClass = "accepted";
        statusText = "🟢 مقبول";
      }

      if (app.status === "rejected") {
        statusClass = "rejected";
        statusText = "🔴 مرفوض";
      }

      const date = new Date(app.created_at)
        .toLocaleDateString("fr-FR");

      return `
        <div class="card">

          <div class="candidate-name">
            👤 ${profile.full_name || "مترشح"}
          </div>

          <div class="info">
            📱 ${profile.phone || "رقم الهاتف غير متوفر"}
          </div>

          <div class="info">
            💼 ${job.title || "عرض عمل"}
          </div>

          <div class="info">
            📅 تاريخ الترشح: ${date}
          </div>

          <div>
            <span class="status ${statusClass}">
              ${statusText}
            </span>
          </div>

          <div class="message">
            💬 <strong>رسالة المترشح:</strong><br>
            ${app.message || "ما فماش رسالة."}
          </div>

          <div class="buttons">

            <button
              class="accept"
              onclick="updateStatus('${app.id}', 'accepted')">
              ✅ قبول
            </button>

            <button
              class="reject"
              onclick="updateStatus('${app.id}', 'rejected')">
              ❌ رفض
            </button>

          </div>

        </div>
      `;

    }).join("");
  }

  async function updateStatus(applicationId, newStatus) {

    const { error } = await supabaseClient
      .from("applications")
      .update({ status: newStatus })
      .eq("id", applicationId);

    if (error) {
      console.error(error);
      alert("❌ صار مشكل في تحديث الحالة");
      return;
    }

    alert(
      newStatus === "accepted"
        ? "✅ تم قبول الترشح"
        : "❌ تم رفض الترشح"
    );

    loadApplications();
  }

  loadApplications();
</script>

</body>
</html>
