<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Ras Jebel Jobs | ترشحات المؤسسة</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f7fa;
      margin: 0;
      color: #222;
    }

    header {
      background: #17324d;
      color: white;
      text-align: center;
      padding: 30px 15px;
    }

    header h1 {
      margin: 0 0 10px;
    }

    main {
      max-width: 950px;
      margin: 30px auto;
      padding: 0 15px;
    }

    .company-box {
      background: white;
      padding: 20px;
      border-radius: 14px;
      margin-bottom: 25px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    .application {
      background: white;
      border-radius: 14px;
      padding: 22px;
      margin-bottom: 20px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    .application h3 {
      margin-top: 0;
      color: #17324d;
    }

    .info {
      margin: 8px 0;
      line-height: 1.6;
    }

    .status {
      display: inline-block;
      padding: 7px 12px;
      border-radius: 8px;
      background: #fff7ed;
      color: #c2410c;
      font-weight: bold;
      margin-top: 8px;
    }

    .message {
      background: #f8fafc;
      padding: 12px;
      border-radius: 8px;
      margin-top: 12px;
      line-height: 1.7;
    }

    .cv {
      display: block;
      text-align: center;
      text-decoration: none;
      background: #17324d;
      color: white;
      padding: 12px;
      border-radius: 8px;
      margin-top: 15px;
      font-weight: bold;
    }

    .cv:hover {
      opacity: 0.9;
    }

    .buttons {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    .buttons button {
      flex: 1;
      border: none;
      padding: 12px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      font-size: 15px;
    }

    .accept {
      background: #dcfce7;
      color: #166534;
    }

    .reject {
      background: #fee2e2;
      color: #991b1b;
    }

    .success {
      background: #ecfdf5;
      color: #047857;
      padding: 12px;
      border-radius: 8px;
      margin-top: 12px;
    }

    .error {
      background: #fef2f2;
      color: #b91c1c;
      padding: 12px;
      border-radius: 8px;
      margin-top: 12px;
    }

    #message {
      text-align: center;
      padding: 20px;
      font-size: 18px;
    }

    footer {
      text-align: center;
      padding: 25px;
      margin-top: 40px;
      background: #17324d;
      color: white;
      line-height: 1.8;
    }

    @media (max-width: 600px) {
      .buttons {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>🏢 فضاء المؤسسة</h1>
  <p>إدارة الترشحات</p>
</header>

<main>

  <div class="company-box">
    <h2>🏢 المؤسسة</h2>
    <div id="companyName">جاري التحميل...</div>
    <div id="count"></div>
  </div>

  <div id="message">
    جاري تحميل الترشحات...
  </div>

  <div id="applications"></div>

</main>

<footer>
  © 2026 Chimiste BOUJEMÂA Rachida — Tous droits réservés<br>
  Ras Jebel Jobs — منصة الوظائف المحلية
</footer>

<script>

const SUPABASE_URL =
  "https://gkiynoqovpuzudzpnryn.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_cUc4p8AVQ6pHfI0oQT-PLA_Kt-5dhdw";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


let companyId = null;


async function loadApplications() {

  const message =
    document.getElementById("message");

  const container =
    document.getElementById("applications");

  const companyName =
    document.getElementById("companyName");

  const count =
    document.getElementById("count");


  // التثبت من تسجيل الدخول

  const {
    data: { user },
    error: userError
  } = await supabaseClient.auth.getUser();


  if (userError || !user) {

    message.innerHTML =
      '<div class="error">❌ يلزم تسجيل الدخول أولا.</div>';

    return;
  }


  // جلب المؤسسة الخاصة بالمستخدم

  const {
    data: company,
    error: companyError
  } = await supabaseClient
    .from("companies")
    .select("id, company_name")
    .eq("owner_id", user.id)
    .limit(1)
    .maybeSingle();


  if (companyError || !company) {

    console.error(companyError);

    message.innerHTML =
      '<div class="error">❌ ما لقيناش المؤسسة الخاصة بالحساب.</div>';

    return;
  }


  companyId =
    company.id;


  companyName.textContent =
    company.company_name || "المؤسسة";


  // جلب عروض المؤسسة

  const {
    data: jobs,
    error: jobsError
  } = await supabaseClient
    .from("jobs")
    .select(
      "id,title,location,contract_type,experience"
    )
    .eq("company_id", companyId);


  if (jobsError) {

    console.error(jobsError);

    message.innerHTML =
      '<div class="error">❌ تعذر تحميل عروض المؤسسة.</div>';

    return;
  }


  if (!jobs || jobs.length === 0) {

    message.innerHTML =
      "📭 ما فماش عروض شغل للمؤسسة.";

    count.textContent =
      "📊 عدد الترشحات: 0";

    return;
  }


  const jobIds =
    jobs.map(job => job.id);


  // جلب الترشحات

  const {
    data: applications,
    error: applicationsError
  } = await supabaseClient
    .from("applications")
    .select(
      "id,job_id,candidate_id,cv_url,message,status,created_at"
    )
    .in("job_id", jobIds)
    .order("created_at", {
      ascending: false
    });


  if (applicationsError) {

    console.error(applicationsError);

    message.innerHTML =
      '<div class="error">❌ تعذر تحميل الترشحات.</div>';

    return;
  }


  count.textContent =
    `📊 عدد الترشحات: ${applications.length}`;


  if (!applications || applications.length === 0) {

    message.innerHTML =
      "📭 ما فماش ترشحات حاليا.";

    return;
  }


  // جلب ملفات المترشحين

  const candidateIds =
    [...new Set(
      applications.map(app => app.candidate_id)
    )];


  const {
    data: profiles,
    error: profilesError
  } = await supabaseClient
    .from("profiles")
    .select("id,full_name,phone")
    .in("id", candidateIds);


  if (profilesError) {

    console.error(profilesError);

    message.innerHTML =
      '<div class="error">❌ تعذر تحميل معلومات المترشحين.</div>';

    return;
  }


  const profileMap = {};


  (profiles || []).forEach(profile => {

    profileMap[profile.id] =
      profile;

  });


  message.innerHTML = "";


  container.innerHTML =
    applications.map(app => {

      const job =
        jobs.find(
          item => item.id === app.job_id
        );


      const profile =
        profileMap[app.candidate_id];


      const status =
        app.status || "pending";


      let statusText =
        "🟡 قيد الدراسة";


      if (status === "accepted") {

        statusText =
          "🟢 مقبول";

      } else if (status === "rejected") {

        statusText =
          "🔴 مرفوض";
      }


      const date =
        new Date(
          app.created_at
        ).toLocaleDateString(
          "fr-FR"
        );


      return `

        <div class="application">

          <h3>
            👤 ${profile?.full_name || "مترشح"}
          </h3>

          <div class="info">
            📱 ${
              profile?.phone ||
              "رقم الهاتف غير متوفر"
            }
          </div>

          <div class="info">
            💼 ${
              job?.title ||
              "عرض شغل"
            }
          </div>

          <div class="info">
            📍 ${
              job?.location ||
              "غير محدد"
            }
          </div>

          <div class="info">
            📄 ${
              job?.contract_type ||
              "غير محدد"
            }
          </div>

          <div class="info">
            🎓 ${
              job?.experience ||
              "غير محدد"
            }
          </div>

          <div class="info">
            📅 تاريخ الترشح: ${date}
          </div>

          <div class="status">
            ${statusText}
          </div>


          <div class="message">

            💬 رسالة المترشح:

            <br>

            ${
              app.message ||
              "ما فماش رسالة."
            }

          </div>


          ${
            app.cv_url
            ?
            `
              <a
                href="${app.cv_url}"
                target="_blank"
                rel="noopener noreferrer"
                class="cv"
              >
                📄 فتح CV
              </a>
            `
            :
            `
              <div class="message">
                📄 المترشح ما رفعش CV.
              </div>
            `
          }


          <div class="buttons">

            <button
              class="accept"
              onclick="updateStatus(
                '${app.id}',
                'accepted'
              )"
            >
              ✅ قبول
            </button>

            <button
              class="reject"
              onclick="updateStatus(
                '${app.id}',
                'rejected'
              )"
            >
              ❌ رفض
            </button>

          </div>

          <div
            id="result-${app.id}"
          ></div>

        </div>

      `;

    }).join("");
}


async function updateStatus(
  applicationId,
  newStatus
) {

  const result =
    document.getElementById(
      `result-${applicationId}`
    );


  const {
    error
  } = await supabaseClient
    .from("applications")
    .update({
      status: newStatus
    })
    .eq(
      "id",
      applicationId
    );


  if (error) {

    console.error(error);

    result.innerHTML =
      `<div class="error">
        ❌ تعذر تحديث حالة الترشح.
      </div>`;

    return;
  }


  result.innerHTML =
    `<div class="success">
      ✅ تم تحديث حالة الترشح بنجاح.
    </div>`;


  setTimeout(
    loadApplications,
    700
  );
}


loadApplications();

</script>

</body>
</html>
