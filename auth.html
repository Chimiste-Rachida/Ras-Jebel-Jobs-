<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ras Jebel Jobs — Connexion</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f5f7fb;
color:#172033;
}

.wrap{
max-width:1050px;
margin:auto;
padding:24px;
}

.top{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:30px;
}

.logo{
font-size:25px;
font-weight:800;
color:#123b5d;
}

.card{
background:white;
border-radius:20px;
box-shadow:0 10px 35px #123b5d18;
padding:30px;
max-width:520px;
margin:30px auto;
}

.tabs{
display:flex;
gap:8px;
background:#eef2f6;
padding:5px;
border-radius:12px;
margin-bottom:22px;
}

.tabs button{
flex:1;
border:0;
padding:12px;
border-radius:9px;
cursor:pointer;
background:transparent;
font-weight:700;
}

.tabs .on{
background:#123b5d;
color:white;
}

.role{
display:flex;
gap:10px;
margin:15px 0;
}

.role button{
flex:1;
padding:12px;
border:1px solid #d8dee8;
border-radius:10px;
background:white;
cursor:pointer;
}

.role .sel{
border-color:#f5a623;
background:#fff8ec;
}

.field{
margin:13px 0;
}

.field label{
display:block;
font-weight:700;
margin-bottom:7px;
}

.field input{
width:100%;
padding:13px;
border:1px solid #d8dee8;
border-radius:10px;
font-size:15px;
}

.main{
width:100%;
padding:14px;
border:0;
border-radius:10px;
background:#123b5d;
color:white;
font-weight:800;
font-size:16px;
cursor:pointer;
margin-top:8px;
}

.linkBtn{
border:0;
background:none;
color:#123b5d;
font-weight:700;
cursor:pointer;
margin-top:12px;
}

.msg{
margin-top:14px;
padding:12px;
border-radius:10px;
display:none;
line-height:1.5;
}

.ok{
background:#e9f8ef;
color:#146c36;
}

.err{
background:#fff0f0;
color:#a11;
}

.small{
text-align:center;
color:#687386;
font-size:13px;
margin-top:18px;
}

.back{
color:#123b5d;
text-decoration:none;
font-weight:700;
}

.hidden{
display:none!important;
}

@media(max-width:600px){
.wrap{padding:15px}
.card{padding:22px}
.role{flex-direction:column}
}
</style>
</head>

<body>

<div class="wrap">

<div class="top">
<div class="logo">🇹🇳 Ras Jebel Jobs</div>

<a class="back" href="index.html">
← Accueil
</a>
</div>

<div class="card">

<div id="authBox">

<div class="tabs">

<button id="loginTab" class="on" onclick="showMode('login')">
Connexion
</button>

<button id="signupTab" onclick="showMode('signup')">
Créer un compte
</button>

</div>

<div id="roleBox" style="display:none">

<b>Je suis :</b>

<div class="role">

<button id="candidate" class="sel" onclick="setRole('candidate')">
👤 Chercheur d'emploi
</button>

<button id="company" onclick="setRole('company')">
🏢 Entreprise
</button>

</div>

</div>

<div id="nameBox" class="field" style="display:none">

<label>Nom et prénom / Nom de l'entreprise</label>

<input id="name" placeholder="Votre nom">

</div>

<div class="field">

<label>Email</label>

<input id="email" type="email" placeholder="exemple@email.com">

</div>

<div class="field">

<label>Mot de passe</label>

<input id="password" type="password" placeholder="Minimum 6 caractères">

</div>

<button id="submit" class="main" onclick="submitAuth()">
Se connecter
</button>

<div style="text-align:center">

<button type="button" class="linkBtn" onclick="showForgot()">
🔑 Mot de passe oublié ?
</button>

</div>

<div id="msg" class="msg"></div>

</div>

<div id="forgotBox" class="hidden">

<h2>🔑 Réinitialiser le mot de passe</h2>

<p>
Entre ton adresse email et nous t'enverrons un lien pour créer un nouveau mot de passe.
</p>

<div class="field">

<label>Email</label>

<input id="resetEmail" type="email" placeholder="exemple@email.com">

</div>

<button class="main" onclick="sendResetEmail()">
Envoyer le lien
</button>

<div style="text-align:center">

<button type="button" class="linkBtn" onclick="showLogin()">
← Retour à la connexion
</button>

</div>

<div id="resetMsg" class="msg"></div>

</div>

<div id="newPasswordBox" class="hidden">

<h2>🔐 Nouveau mot de passe</h2>

<p>
Choisis maintenant ton nouveau mot de passe.
</p>

<div class="field">

<label>Nouveau mot de passe</label>

<input id="newPassword" type="password" placeholder="Minimum 6 caractères">

</div>

<div class="field">

<label>Confirmer le mot de passe</label>

<input id="confirmPassword" type="password" placeholder="Retape le mot de passe">

</div>

<button class="main" onclick="updatePassword()">
Enregistrer le nouveau mot de passe
</button>

<div id="passwordMsg" class="msg"></div>

</div>

<div class="small">
Ras Jebel Jobs — Plateforme locale d'emploi
</div>

</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
'https://gkiynoqovpuzudzpnryn.supabase.co';

const SUPABASE_KEY =
'sb_publishable_cUc4p8AVQ6pHfI0oQT-PLA_Kt-5dhdw';

const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

let mode='login';
let role='candidate';

function showMode(m){

mode=m;

document.getElementById('loginTab')
.classList.toggle('on',m==='login');

document.getElementById('signupTab')
.classList.toggle('on',m==='signup');

document.getElementById('roleBox').style.display=
m==='signup'?'block':'none';

document.getElementById('nameBox').style.display=
m==='signup'?'block':'none';

document.getElementById('submit').textContent=
m==='signup'?'Créer mon compte':'Se connecter';

}

function setRole(r){

role=r;

document.getElementById('candidate')
.classList.toggle('sel',r==='candidate');

document.getElementById('company')
.classList.toggle('sel',r==='company');

}

function showForgot(){

document.getElementById('authBox')
.classList.add('hidden');

document.getElementById('forgotBox')
.classList.remove('hidden');

}

function showLogin(){

document.getElementById('forgotBox')
.classList.add('hidden');

document.getElementById('newPasswordBox')
.classList.add('hidden');

document.getElementById('authBox')
.classList.remove('hidden');

mode='login';

}

function showMessage(id,text,ok=false){

const e=document.getElementById(id);

e.textContent=text;

e.className='msg '+(ok?'ok':'err');

e.style.display='block';

}

async function sendResetEmail(){

const email=document.getElementById('resetEmail')
.value.trim();

if(!email){

showMessage('resetMsg','اكتب الإيميل متاعك.');

return;
}

try{

const redirectUrl=
window.location.origin+
window.location.pathname;

const {error}=await supabaseClient.auth
.resetPasswordForEmail(
email,
{redirectTo:redirectUrl}
);

if(error) throw error;

showMessage(
'resetMsg',
'تم إرسال رابط تغيير كلمة العبور إلى إيميلك ✅ تفقد البريد الإلكتروني.',
true
);

}catch(e){

showMessage(
'resetMsg',
e.message||'حدث خطأ.',
false
);

}

}

supabaseClient.auth.onAuthStateChange(
async(event,session)=>{

if(event==='PASSWORD_RECOVERY'){

document.getElementById('authBox')
.classList.add('hidden');

document.getElementById('forgotBox')
.classList.add('hidden');

document.getElementById('newPasswordBox')
.classList.remove('hidden');

}

});

async function updatePassword(){

const password=
document.getElementById('newPassword').value;

const confirm=
document.getElementById('confirmPassword').value;

if(!password||!confirm){

showMessage(
'passwordMsg',
'اكتب كلمة العبور الجديدة وأعد كتابتها.'
);

return;
}

if(password.length<6){

showMessage(
'passwordMsg',
'كلمة العبور لازم تكون 6 أحرف على الأقل.'
);

return;
}

if(password!==confirm){

showMessage(
'passwordMsg',
'كلمتا العبور غير متطابقتين.'
);

return;
}

try{

const {error}=await supabaseClient.auth
.updateUser({password:password});

if(error) throw error;

showMessage(
'passwordMsg',
'تم تغيير كلمة العبور بنجاح ✅',
true
);

setTimeout(showLogin,1500);

}catch(e){

showMessage(
'passwordMsg',
e.message||'حدث خطأ.'
);

}

}

async function submitAuth(){

const email=
document.getElementById('email').value.trim();

const password=
document.getElementById('password').value;

const name=
document.getElementById('name').value.trim();

if(!email||!password){

showMessage(
'msg',
'اكتب الإيميل وكلمة العبور.'
);

return;
}

try{

if(mode==='signup'){

if(!name){

showMessage('msg','اكتب الاسم.');

return;
}

const {data,error}=
await supabaseClient.auth.signUp({

email:email,

password:password,

options:{
data:{
full_name:name,
role:role
}
}

});

if(error) throw error;

showMessage(
'msg',
'تم إنشاء الحساب بنجاح ✅',
true
);

return;

}

const {data,error}=
await supabaseClient.auth.signInWithPassword({

email:email,

password:password

});

if(error) throw error;

const user=data.user;

const savedRole=
user?.user_metadata?.role||'candidate';

showMessage(
'msg',
'تم تسجيل الدخول بنجاح ✅',
true
);

setTimeout(()=>{

if(savedRole==='company'){

/*
لا يوجد حاليًا company-dashboard.html
لذلك نرجع للصفحة الرئيسية مؤقتًا.
*/

location.href='index.html';

}else{

location.href='candidat.html';

}

},800);

}catch(e){

console.error(e);

showMessage(
'msg',
e.message||'حدث خطأ. حاول مرة أخرى.'
);

}

}

</script>

</body>
</html>
